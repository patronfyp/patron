[project]
name = "patron-backend"
version = "0.1.0"
description = "Patron API - a trust-based hiring platform built on Recommendations, Employee Referrals and Alumni Referrals."
readme = "README.md"
authors = [
    { name = "Abdul Rafay", email = "abdul.rafay9714@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

# -----------------------------------------------------------------------------
# uv
# -----------------------------------------------------------------------------
[tool.uv]
# This is an application, not a distributable library - so uv should not try to
# build/install it as a package.
package = false

# The uv cache lives on C: while this project is on D:. Windows cannot hardlink
# across drives, so copy instead (silences the hardlink warning on install).
link-mode = "copy"

# -----------------------------------------------------------------------------
# Ruff - linter AND formatter (replaces flake8 + black + isort + pylint)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes - unused imports/variables, real bugs
    "I",     # isort - import sorting
    "N",     # pep8-naming - naming conventions
    "UP",    # pyupgrade - use modern Python syntax
    "B",     # flake8-bugbear - likely bugs and design problems
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async - common async/await mistakes
    "S",     # flake8-bandit - security issues
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501", # line length - the formatter already handles this
]

[tool.ruff.lint.per-file-ignores]
# assert is the whole point of a test file
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
